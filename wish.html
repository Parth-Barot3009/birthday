<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 💖</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<audio id="bgMusic" preload="auto">
    <source src="video1.mp3" type="audio/mpeg">
</audio>

<!-- 🎬 Overlay Intro -->
<div id="overlay">
    <h2 class="intro-text">A special moment... 💖</h2>
</div>

<!-- 🎂 Main Content -->
<div class="wish-container hidden">
    <h1 class="wish-name">Vishwa 💖</h1>

    <p class="wish-text">
        Happy Birthday 🎂 <br>
        You make life more beautiful ✨ <br>
        Stay happy always 😊
    </p>
</div>

<script>

// 🎵 PLAY MUSIC AFTER BUTTON CLICK FROM PREVIOUS PAGE
window.addEventListener("load", () => {
    const shouldPlay = localStorage.getItem("playMusic");

    if (shouldPlay === "true") {
        const music = document.getElementById("bgMusic");

        music.load();

        music.play()
            .then(() => {
                console.log("Music started ✅");
                startBeatFireworks();
            })
            .catch(() => {
                console.log("Autoplay blocked ❌");
            });

        // reset
        localStorage.removeItem("playMusic");
    }
});

// 🎬 UI ANIMATION ONLY (NO MUSIC HERE)
setTimeout(()=>{
    document.getElementById("overlay").classList.add("fade-out");
},2000);

setTimeout(()=>{
    document.getElementById("overlay").style.display="none";

    const container = document.querySelector(".wish-container");
    container.classList.remove("hidden");

    setTimeout(()=>{
        container.classList.add("show");
        bigExplosion();
    },100);

},3000);

// ⭐ STARS
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for(let i=0;i<120;i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*2,
        speed: Math.random()*0.5
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";

    stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();

        s.y+=s.speed;
        if(s.y>canvas.height){
            s.y=0;
            s.x=Math.random()*canvas.width;
        }
    });

    requestAnimationFrame(draw);
}
draw();

// 💖 HEARTS
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "bg-heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 400);

// 🎆 FIREWORKS
const fireCanvas = document.getElementById("fireworks");
const fctx = fireCanvas.getContext("2d");

fireCanvas.width = window.innerWidth;
fireCanvas.height = window.innerHeight;

let particles = [];

function createFirework(x, y) {
    for (let i = 0; i < 30; i++) {
        particles.push({
            x, y,
            angle: Math.random() * Math.PI * 2,
            speed: Math.random() * 4 + 1,
            radius: Math.random() * 2 + 1,
            life: 80,
            color: `hsl(${Math.random()*360},100%,60%)`
        });
    }
}

function animateFireworks() {
    fctx.fillStyle = "rgba(15,15,26,0.2)";
    fctx.fillRect(0, 0, fireCanvas.width, fireCanvas.height);

    particles.forEach((p, i) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.life--;

        fctx.beginPath();
        fctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        fctx.fillStyle = p.color;
        fctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(animateFireworks);
}
animateFireworks();

// 💥 BIG BLAST
function bigExplosion() {
    for (let i = 0; i < 80; i++) {
        particles.push({
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            angle: Math.random() * Math.PI * 2,
            speed: Math.random() * 6 + 2,
            radius: Math.random() * 3 + 1,
            life: 120,
            color: `hsl(${Math.random()*360},100%,60%)`
        });
    }
}

// 🎵 BEAT FIREWORKS
function startBeatFireworks() {
    setInterval(() => {
        createFirework(
            Math.random() * window.innerWidth,
            Math.random() * (window.innerHeight / 2)
        );
    }, 600);
}

</script>

</body>
</html>
